name: Build and deploy Node.js app to Azure Web App - level-up-pomodoro

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_level-up-pomodoro.yml"
  workflow_dispatch:

concurrency:
  group: azure-app-service-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E180C343D0F943E18C3F7449A4BCDD9C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_526CEFF2F3FB46EBAB337AB48484E73C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42A1C38CF75842E98ED3DCA01CE6C87F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: level-up-pomodoro
          slot-name: Production
          package: .
