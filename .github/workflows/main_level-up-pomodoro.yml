name: Build and deploy Node.js app to Azure Web App - level-up-pomodoro2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_level-up-pomodoro.yml"
  workflow_dispatch:

concurrency:
  group: azure-app-service-production
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B230551ED4DB41E8B5C3E53DBB6847BD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FF18CC771C214DFE9C93A23E90C73616 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC7A2BA01ED14DD59FC3916B75EE426F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: level-up-pomodoro2
          slot-name: Production
          package: backend
